name: Release

# Pushing a tag such as v0.1.0-preview.1 publishes that version: the Cantrip.Core and Cantrip.Cli
# packages to nuget.org, and a GitHub release with the packages and the Godot addon zip. Nothing
# is published unless every check before it passes, and the tag must match the version set in
# Directory.Build.props, which is the only place a version lives.
#
# Publishing uses nuget.org Trusted Publishing: GitHub vouches for this repository and this workflow
# file, and nuget.org hands back an API key that lasts an hour, so no long-lived key is stored anywhere.
# It needs a trusted publishing policy on nuget.org (owner AGomnes, repository Cantrip, workflow file
# release.yml) and one repository secret, NUGET_USER: the nuget.org profile name, not the email.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # ask GitHub for the token that nuget.org exchanges for a temporary API key

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Check the tag matches the version and publishing is set up
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          version=$(dotnet msbuild src/Cantrip.Core/Cantrip.Core.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Directory.Build.props."
            exit 1
          fi
          if [ -z "$NUGET_USER" ]; then
            echo "::error::The NUGET_USER repository secret (your nuget.org profile name) is not set, so nothing can be published."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build Cantrip.sln -c Release

      - name: Unit tests
        run: |
          dotnet test tests/Cantrip.Core.Tests -c Release --no-build
          dotnet test tests/Cantrip.Godot.Tests -c Release --no-build

      - name: DSL tests and lint
        run: |
          for folder in samples/basic samples/corpus samples/slice; do
            dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint "$folder"
            dotnet run --project src/Cantrip.Cli -c Release --no-build -- test "$folder"
          done

      - name: Pack
        run: |
          dotnet pack src/Cantrip.Core -c Release --no-build -o "$RUNNER_TEMP/packages"
          dotnet pack src/Cantrip.Cli -c Release --no-build -o "$RUNNER_TEMP/packages"
          ls -l "$RUNNER_TEMP/packages"

      # The last gate: a stranger's first fifteen minutes, run against exactly these packages.
      - name: Quickstart from these packages
        run: bash tools/quickstart-smoke.sh "$RUNNER_TEMP/packages"

      - name: Package the Godot addon
        run: bash tools/package-addon.sh "$RUNNER_TEMP/addon"

      - name: Release notes from the changelog
        run: |
          # Literal matching on purpose: as a regex, "[0.1.0-preview.1]" is a character class.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]."
            exit 1
          fi

      # The temporary key lasts an hour, so it is fetched only now, after every check has passed.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate makes a re-run safe after a later step fails. Symbol packages (.snupkg)
      # beside the .nupkg files are pushed with them.
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$RUNNER_TEMP/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Cantrip $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $prerelease \
            "$RUNNER_TEMP"/packages/*.nupkg "$RUNNER_TEMP"/packages/*.snupkg "$RUNNER_TEMP"/addon/*.zip
