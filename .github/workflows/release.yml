name: Release

# Pushing a tag such as v0.1.0-preview.1 publishes that version: the Cantrip.Core and Cantrip.Cli
# packages to nuget.org, and a GitHub release with the packages and the Godot addon zip. A package
# on nuget.org cannot be deleted, only unlisted, so publishing is the last job and everything that
# can fail runs first: the tag must match the version in Directory.Build.props, the whole CI
# workflow must pass at the tagged commit, and the quickstart must work against the packages built.
#
# Publishing uses nuget.org Trusted Publishing: GitHub vouches for this repository and this workflow
# file, and nuget.org hands back an API key that lasts an hour, so no long-lived key is stored anywhere.
# It needs a trusted publishing policy on nuget.org (owner AGomnes, repository Cantrip, workflow file
# release.yml) and one repository secret, NUGET_USER: the nuget.org profile name, not the email.
#
# The released addon is also copied to AGomnes/cantrip-godot, which has addons/cantrip at its root,
# the layout the Godot Asset Library installs from. That needs a second secret, ADDON_REPO_TOKEN: a
# fine-grained token with Contents read and write on that one repository.
on:
  push:
    tags: ['v*']

# Read-only by default. Only the publish job, which runs no build or test code, gets more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Check the tag matches the version and publishing is set up
        id: version
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
          ADDON_REPO_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
        run: |
          version=$(dotnet msbuild src/Cantrip.Core/Cantrip.Core.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Directory.Build.props."
            exit 1
          fi
          if [ -z "$NUGET_USER" ]; then
            echo "::error::The NUGET_USER repository secret (your nuget.org profile name) is not set, so nothing can be published."
            exit 1
          fi
          if [ -z "$ADDON_REPO_TOKEN" ]; then
            echo "::error::The ADDON_REPO_TOKEN repository secret is not set, so the addon repository cannot be updated."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Everything CI checks on a push to main, at exactly the commit being released: both platforms,
  # the slice simulation, and the Godot job, which is the only place the addon's code is compiled.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, ci]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build Cantrip.sln -c Release

      - name: Pack
        run: |
          dotnet pack src/Cantrip.Core -c Release --no-build -o "$RUNNER_TEMP/release/packages"
          dotnet pack src/Cantrip.Cli -c Release --no-build -o "$RUNNER_TEMP/release/packages"
          ls -l "$RUNNER_TEMP/release/packages"

      # The last gate: a stranger's first fifteen minutes, run against exactly these packages.
      - name: Quickstart from these packages
        run: bash tools/quickstart-smoke.sh "$RUNNER_TEMP/release/packages"

      # Both READMEs that reach users link docs/godot.md. Someone who installs this release should
      # read the guide as it is at this tag, not on main, which may already have moved on, so their
      # links into this repository's main branch are pointed at the tag, as the release notes are.
      - name: Package the Godot addon
        run: |
          bash tools/package-addon.sh "$RUNNER_TEMP/release/addon" "$GITHUB_REF_NAME"
          cp -r tools/addon-repo "$RUNNER_TEMP/release/addon-repo"
          sed -i -E "s#(https://github\.com/AGomnes/Cantrip/(blob|tree))/main/#\1/${GITHUB_REF_NAME}/#g" "$RUNNER_TEMP/release/addon-repo/README.md"
          unzip -p "$RUNNER_TEMP"/release/addon/*.zip addons/cantrip/README.md > "$RUNNER_TEMP/zipped-readme.md"
          for readme in "$RUNNER_TEMP/release/addon-repo/README.md" "$RUNNER_TEMP/zipped-readme.md"; do
            if grep -q -E "AGomnes/Cantrip/(blob|tree)/main/" "$readme" || ! grep -q -F "blob/${GITHUB_REF_NAME}/docs/godot.md" "$readme"; then
              echo "::error::A README that ships with the addon does not link docs/godot.md at ${GITHUB_REF_NAME}."
              exit 1
            fi
          done

      # The changelog's links are relative, which works in the repository but not in a release body,
      # so each one is pointed at the file as it is at this tag.
      - name: Release notes from the changelog
        run: |
          # Literal matching on purpose: as a regex, "[0.1.0-preview.1]" is a character class.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release/notes.md"
          if [ ! -s "$RUNNER_TEMP/release/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for [$VERSION]."
            exit 1
          fi
          sed -i -E "s|\]\(([^)#:][^):]*)\)|](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1)|g" "$RUNNER_TEMP/release/notes.md"
          cat "$RUNNER_TEMP/release/notes.md"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          include-hidden-files: true   # the addon repository's .gitattributes

  # The only job allowed to publish. It checks nothing out and builds nothing, so no third-party
  # build or test code ever runs where the repository token or the nuget.org key is available.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # ask GitHub for the token that nuget.org exchanges for a temporary API key
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # The temporary key lasts an hour, so it is fetched only now, after every check has passed.
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate makes a re-run safe after a later step fails. Symbol packages (.snupkg)
      # beside the .nupkg files are pushed with them.
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$RUNNER_TEMP/release/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP"/release/packages/*.nupkg "$RUNNER_TEMP"/release/packages/*.snupkg "$RUNNER_TEMP"/release/addon/*.zip)
          # A re-run after a later step failed finds the release already there: refresh its files.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            exit 0
          fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cantrip $VERSION" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            $prerelease \
            "${files[@]}"

      # AGomnes/cantrip-godot holds only the addon, at its root, which is the layout the Godot Asset
      # Library installs from. It is replaced wholesale by each release, committed and tagged with
      # the same version; a re-run that finds the tag already there leaves it alone.
      - name: Update the addon repository
        env:
          TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
        run: |
          work="$RUNNER_TEMP/addon-repo-clone"
          git clone --quiet "https://x-access-token:${TOKEN}@github.com/AGomnes/cantrip-godot.git" "$work"
          cd "$work"
          if git rev-parse -q --verify "refs/tags/$GITHUB_REF_NAME" > /dev/null; then
            echo "cantrip-godot already has $GITHUB_REF_NAME."
            exit 0
          fi
          git rm -r -q --ignore-unmatch addons
          unzip -q "$RUNNER_TEMP"/release/addon/*.zip -d .
          cp "$RUNNER_TEMP/release/addon-repo/README.md" "$RUNNER_TEMP/release/addon-repo/.gitattributes" .
          git add -A
          git -c user.name="Alexander Gomnes" -c user.email="alexander.gomnes@hotmail.com" \
            commit -q -m "Cantrip $VERSION" -m "Released from https://github.com/AGomnes/Cantrip/releases/tag/$GITHUB_REF_NAME"
          git tag "$GITHUB_REF_NAME"
          git push --quiet origin HEAD:main "$GITHUB_REF_NAME"
          echo "cantrip-godot $GITHUB_REF_NAME is $(git rev-parse HEAD)"
