name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this one, so a version is only published from a commit that passes
  # all of it: both platforms, the simulation and the Godot job.
  workflow_call:

# Nothing here writes to the repository. Stated, so a caller with wider rights cannot widen it.
permissions:
  contents: read

jobs:
  build:
    # Both platforms, because determinism across machines is a product requirement:
    # the same seed and inputs must produce the same game everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build Cantrip.sln -c Release

      - name: Unit tests
        run: dotnet test tests/Cantrip.Core.Tests -c Release --no-build

      # The adapter's engine-free half: event buffering, view mapping, tick maths, choice ids.
      # It compiles the addon's shared/ files directly, so it needs no Godot at all.
      - name: Adapter tests
        run: dotnet test tests/Cantrip.Godot.Tests -c Release --no-build

      # Each sample folder is its own game with its own definitions, so they are linted separately.
      # Every folder is free of warnings, so a new warning fails the build rather than scrolling by.
      - name: Lint samples/basic
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint samples/basic --warnings-as-errors

      - name: Lint samples/corpus
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint samples/corpus --warnings-as-errors

      - name: DSL tests (samples/basic)
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test samples/basic

      - name: DSL tests (samples/corpus)
        if: hashFiles('samples/corpus/**') != ''
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test samples/corpus

      - name: Lint samples/slice
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint samples/slice --warnings-as-errors

      - name: DSL tests (samples/slice)
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test samples/slice

      # The tower stated as a scenario and played a hundred times by each of the two default bots.
      # It fails on a run that throws, a battle that reaches the turn limit and an expectation that
      # does not hold, which is how a rules loop or a runtime error in content shows up long before
      # a person would find it.
      - name: Simulate samples/slice
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- sim samples/slice --runs 100

      # The recipes in docs/writing-content.md, so a recipe that stops working fails the build.
      - name: Lint samples/recipes
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint samples/recipes --warnings-as-errors

      - name: DSL tests (samples/recipes)
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test samples/recipes

      # A fight with no cards in it, which the README points at: the combat of a turn-based
      # roguelike, so a change that quietly made cards compulsory would fail here.
      - name: Lint samples/abilities
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint samples/abilities --warnings-as-errors

      - name: DSL tests (samples/abilities)
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test samples/abilities

      # The same fight with no cards, played a hundred times by each bot: a bot that could only
      # play cards would stall every run here, and a stall fails this step.
      - name: Simulate samples/abilities
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- sim samples/abilities --runs 100

      # A fight on a board with more than one row: three floors, three slots to a floor, and a
      # summon that a full floor turns away. A change that quietly flattened the board back into
      # one row, or let a summon land past the end of a floor, would fail here.
      - name: Lint samples/board
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint samples/board --warnings-as-errors

      - name: DSL tests (samples/board)
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test samples/board

      # And played a hundred times by each bot, so that a board which stalled one — a floor with no
      # room making a card do nothing, for ever — fails this step rather than shipping.
      - name: Simulate samples/board
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- sim samples/board --runs 100

      # A party of heroes: more than one actor on the player's side that the game asks for input,
      # abilities that honour their own target line, an enemy that says who it is going to hit, and
      # a battle that is lost only when the last member falls. A change that quietly went back to
      # "the player is the party" would fail here rather than in somebody's game.
      - name: Lint samples/party
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint samples/party --warnings-as-errors

      - name: DSL tests (samples/party)
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test samples/party

      # And a bot fights it, which is the half that needs a bot to ask every member rather than the
      # leader alone. A bot that went back to playing one hero would stall here.
      - name: Simulate samples/party
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- sim samples/party --runs 100

      # The reference game: a whole roguelite built with the library from the published docs, a
      # party on a board under `turns: initiative`, cards and abilities together, and a run above
      # the battle written in C#. It is the sample that has to keep working as a *game* rather
      # than as an illustration of one feature, so a change that only shows up when several of
      # them are used at once fails here. See reference/FINDINGS.md.
      - name: Lint reference/content
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint reference/content --warnings-as-errors

      - name: DSL tests (reference/content)
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test reference/content

      - name: Simulate reference/content
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- sim reference/content --runs 100

      # A whole descent, played headlessly, on eight seeds, each one saved part-way down and
      # restored into a separate runtime that then has to play the rest of the run identically.
      # That is the promise 1.x makes about saves, checked against a real run rather than a unit.
      - name: The reference game plays itself
        run: |
          dotnet build reference/host/Cantrip.Reference.csproj -c Release
          dotnet run --project reference/host -c Release --no-build -- --check

      # Emberline: the real-time game. Nothing else in the repository drives the tick clock as a
      # game -- no turns anywhere, cooldowns in seconds, enemies that act from their own
      # `on every` listeners, and a host that owns the frame loop. See realtime/FINDINGS.md.
      - name: Lint realtime/content
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- lint realtime/content --warnings-as-errors

      - name: DSL tests (realtime/content)
        run: dotnet run --project src/Cantrip.Cli -c Release --no-build -- test realtime/content

      # There is no `sim` step here and no scenario in realtime/content, because `cantrip sim`
      # cannot play a real-time game and now says so: a bot plays a scenario by taking turns, and
      # this game has none. A scenario written here would be error CT338 at the lint step above.
      - name: The real-time game plays itself
        run: |
          dotnet build realtime/host/Cantrip.Realtime.csproj -c Release
          dotnet run --project realtime/host -c Release --no-build -- --check

      # Pack the two NuGet packages and follow docs/quickstart.md word for word against them, in an
      # empty folder. This is what a new user does first, so it is what must never break. Linux
      # only: the packages are the same on both, and the script is bash.
      - name: Quickstart from freshly packed packages
        if: runner.os == 'Linux'
        run: |
          dotnet pack src/Cantrip.Core -c Release --no-build -o "$RUNNER_TEMP/feed"
          dotnet pack src/Cantrip.Cli -c Release --no-build -o "$RUNNER_TEMP/feed"
          bash tools/quickstart-smoke.sh "$RUNNER_TEMP/feed"

  godot:
    # Everything that can only break inside a real engine: importing content, the Variant
    # boundary, signals, and the GDScript call path. Linux only, because this is about the
    # adapter rather than cross-platform determinism, which the matrix above already covers.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache Godot
        id: godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.6.1-mono-linux

      - name: Download Godot
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_mono_linux_x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot

      - name: Find the binary
        run: |
          GODOT=$(find ~/godot -type f -name 'Godot_v*_mono_linux*' ! -name '*.zip' | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --headless --version

      # Build first, always. Without the assembly the plugin does not load and the importer never
      # runs, yet --import still exits 0, so a missing build would look like a pass.
      - name: Build the addon
        run: |
          dotnet build godot/Cantrip.Demo/Cantrip.Demo.csproj
          dotnet build godot/Cantrip.Demo/Cantrip.Demo.csproj -c ExportRelease

      - name: Import content
        run: timeout 300 "$GODOT" --headless --path godot/Cantrip.Demo --import

      # Each scene exits non-zero on a failed check. The timeouts matter: a script that cannot
      # parse never reaches its quit() and would otherwise hang the job.
      - name: Headless tests
        run: timeout 300 "$GODOT" --headless --path godot/Cantrip.Demo res://tests/headless.tscn

      - name: GDScript smoke test
        run: timeout 300 "$GODOT" --headless --path godot/Cantrip.Demo res://tests/gdscript_smoke.tscn

      # The demo is the worked example in docs/godot.md, so it has to keep working.
      - name: Demo plays itself
        run: timeout 300 "$GODOT" --headless --path godot/Cantrip.Demo res://demo/battle.tscn -- --demo-auto

      - name: Editor dock self-test
        run: timeout 300 "$GODOT" --headless --path godot/Cantrip.Demo --import -- --cantrip-selftest

      # The reference game as a Godot project of its own. assemble.sh puts the addon and the
      # content in place, because Godot finds scripts by path inside the project and neither is
      # in the repository twice.
      - name: Assemble the reference game
        run: |
          bash reference/godot/assemble.sh
          dotnet build reference/godot/Cantrip.Reference.Godot.csproj
          timeout 300 "$GODOT" --headless --path reference/godot --import

      - name: The reference game answers for the node
        run: timeout 300 "$GODOT" --headless --path reference/godot res://game/checks.tscn

      - name: The reference game plays a whole descent in Godot
        run: timeout 300 "$GODOT" --headless --path reference/godot res://game/chapel.tscn -- --chapel-auto

      # Emberline as a Godot project of its own, with its clock coming from the engine's own
      # physics loop through the addon's TickDriver. Nothing else in this repository uses that
      # node at all, so these three steps are the whole of its coverage.
      - name: Assemble the real-time game
        run: |
          bash realtime/godot/assemble.sh
          dotnet build realtime/godot/Cantrip.Realtime.Godot.csproj
          timeout 300 "$GODOT" --headless --path realtime/godot --import

      - name: The real-time game answers for the node
        run: timeout 300 "$GODOT" --headless --path realtime/godot res://game/checks.tscn

      - name: The real-time game holds the line in Godot
        run: timeout 300 "$GODOT" --headless --path realtime/godot res://game/emberline.tscn -- --emberline-auto

      # The addon as a user gets it: the release zip unzipped into a blank Godot project outside the
      # repository, Cantrip.Core added the way docs/godot.md says, then a battle from GDScript. The
      # demo above inherits this repository's build settings, so only this shows a user's view.
      - name: Install into a blank project
        run: |
          dotnet pack src/Cantrip.Core -c Release -o "$RUNNER_TEMP/feed"
          bash tools/package-addon.sh "$RUNNER_TEMP/addon"
          bash tools/godot-install-smoke.sh "$GODOT" "$RUNNER_TEMP"/addon/*.zip "$RUNNER_TEMP/feed"
