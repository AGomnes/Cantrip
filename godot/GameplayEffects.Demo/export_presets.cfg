; Committed on purpose: the export test needs a preset, and the point of that test is to prove
; content reaches a packaged build. Note include_filter is empty — .ge files travel as the
; resources the importer produced, so if the importer were broken the exported game would start
; with nothing, which is exactly the failure being watched for.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../scratch/export/demo.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

